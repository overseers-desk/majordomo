[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "majordomo"
version = "0.5.1"
description = "Read and report Google Chat task activity from the cache mirror; send messages and thread replies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "google-api-python-client>=2",
    "google-auth-oauthlib>=1",
    "google-auth>=2",
    "claude-agent-sdk>=0.2.167",
    "pyyaml>=6",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0.0",
]
bi = [
    "pymysql>=1.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
majordomo = "majordomo.cli:app"
imperson = "imperson.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imperson = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_functions = "test_*"
