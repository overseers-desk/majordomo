[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "majordomo-imperson"
version = "0.1.0"
description = "Answers Google Chat direct messages as an account, one Claude Agent SDK session per conversation, with skills."
requires-python = ">=3.11"
dependencies = ["majordomo>=0.5.1", "pyyaml>=6", "claude-agent-sdk>=0.2.167"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
imperson = "imperson:main"

[tool.setuptools]
py-modules = ["imperson", "reimbursement"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
