[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "majordomo-reimbursement"
version = "0.1.0"
description = "Answers employees' invoice photos in a Google Chat direct message: qualifies, checks duplicates and the weekly allowance, and tasks a person with the payment."
requires-python = ">=3.11"
dependencies = ["majordomo", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
py-modules = ["reimburse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
